<button mat-icon-button mat-dialog-close class="close-button">
  <mat-icon>close</mat-icon>
</button>
<div matDialogTitle>
  {{ this.data.get('name') }}
  <i>{{ this.data.get('type_name') }}</i>
</div>
<mat-tab-group dynamicHeight>
  <mat-tab label="Latest data">
    @if (data) {
    <app-data-table [data]="data"></app-data-table>
    }
  </mat-tab>
  <mat-tab label="Graphs">
    @if (data) {
    <app-graphs [data]="data"></app-graphs>
    }
  </mat-tab>
  @if (isString(this.data.get('descriptio'))) {
  <mat-tab label="Description">
    <div [innerHTML]="this.data.get('descriptio')"></div>
  </mat-tab>
  }
</mat-tab-group>
